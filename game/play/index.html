<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071315">
  <title>远航抉择：德国｜开始游戏</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;margin:0;overflow-y:scroll;background:#071315}
    body{min-height:100%;margin:0;overflow:visible;background:#071315;color:#fff;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
    .bar{position:sticky;z-index:10;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #214044;background:#091719}
    .brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.08em}.mark{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,#75d34f,#0d7fbb)}.actions{display:flex;gap:16px}.actions a{color:#9fc7c8;text-decoration:none;font-size:13px}.actions a:hover{color:#fff}
    iframe{display:block;width:100%;height:max(1050px,calc(100vh - 54px));border:0;background:#071315}
    .fallback{display:none}noscript .fallback{display:block;padding:40px}
    @media(max-width:640px){.brand span:last-child{display:none}.bar{padding:0 12px}.actions{gap:10px}iframe{height:max(900px,calc(100svh - 54px))}}
  </style>
</head>
<body>
  <header class="bar"><div class="brand"><i class="mark"></i><b>Global ESG Insight</b><span>／ 远航抉择：德国</span></div><nav class="actions"><a href="/global-esg-insight/game/">游戏介绍</a><a href="https://global-esg-game.pages.dev/" target="_blank" rel="noopener">新窗口打开 ↗</a></nav></header>
  <iframe title="远航抉择：德国游戏" src="/global-esg-insight/game/play/app/" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <noscript><div class="fallback">请启用 JavaScript，或<a href="https://global-esg-game.pages.dev/">直接打开游戏</a>。</div></noscript>
</body>
</html>
